<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>土木をブロックでつくろう</title>
<style>
:root{--navy:#10294a;--teal:#1f9aa0;--gold:#f2bd3f;--ice:#e8f4f8}
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#bfe6f2;color:var(--navy);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif}
#view{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#title{position:fixed;left:24px;top:18px;margin:0;font-size:38px;color:#fff;text-shadow:0 3px 0 var(--navy),2px 0 0 var(--navy),-2px 0 0 var(--navy),0 -2px 0 var(--navy);pointer-events:none}
#note{position:fixed;left:26px;top:76px;margin:0;font-size:17px;font-weight:700;background:rgba(232,244,248,.92);padding:6px 14px;border-radius:10px;pointer-events:none}
#panel{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);width:min(980px,calc(100vw - 32px));background:var(--ice);border:4px solid var(--navy);border-radius:22px;padding:14px 22px 20px;text-align:center;box-shadow:0 6px 0 rgba(16,41,74,.25)}
#panel h2{margin:4px 0 12px;font-size:30px}
.dots{display:flex;gap:8px;justify-content:center}.dots i{width:40px;height:9px;border-radius:5px;background:#c3d4dc}.dots i.on{background:var(--teal)}
.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
button{font:inherit;color:inherit;cursor:pointer;border:0}
.opts button{min-height:84px;background:#fff;border:3px solid var(--navy);border-radius:14px;font-size:27px;font-weight:700;box-shadow:0 5px 0 var(--navy);display:flex;align-items:center;justify-content:center;gap:10px}
.opts button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--navy)}
.chip{width:30px;height:30px;border-radius:6px;border:2px solid var(--navy)}
.done{font-size:30px;font-weight:700;margin:4px 0 8px}
.ask{font-size:24px;margin:0 0 14px}.ask small{display:block;font-size:15px;color:#2b5a66}
[hidden]{display:none!important}
#shot{position:fixed;right:24px;top:20px;background:var(--gold);font-size:22px;font-weight:700;padding:12px 24px;border-radius:30px;border:3px solid var(--navy);box-shadow:0 4px 0 var(--navy)}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}#flash.go{animation:f .35s}@keyframes f{from{opacity:.95}to{opacity:0}}
#toast{position:fixed;right:24px;top:90px;width:280px;background:var(--ice);border:4px solid var(--navy);border-radius:16px;padding:12px;text-align:center}
#toast img{width:100%;border-radius:8px;display:block}#toast p{margin:8px 0;font-size:20px;font-weight:700}
#toast button{display:block;width:100%;margin-top:6px;padding:10px;background:#fff;border:2px solid var(--navy);border-radius:10px;font-size:16px;font-weight:700}
#gifb{position:fixed;right:268px;top:20px;background:#fff;font-size:22px;font-weight:700;padding:12px 24px;border-radius:30px;border:3px solid var(--navy);box-shadow:0 4px 0 var(--navy)}
#busy{position:fixed;inset:0;display:grid;place-items:center;background:rgba(16,41,74,.6);color:#fff;font-size:34px;font-weight:700}
#gallery{position:fixed;inset:0;z-index:20;background:#bfe6f2;padding:20px}
#gtext{position:absolute;left:28px;top:22px;width:290px}
#gallery h1{margin:0;font-size:35px;white-space:nowrap;line-height:1.25;color:#fff;text-shadow:0 4px 0 var(--navy),3px 0 0 var(--navy),-3px 0 0 var(--navy),0 -3px 0 var(--navy)}
#gallery p{margin:14px 0 12px;font-size:25px;font-weight:700}
#gallery small{display:block;font-size:15px;font-weight:700;line-height:1.5}
#prep{position:absolute;left:0;right:0;top:45%;text-align:center;font-size:26px}
#cards{position:absolute;right:20px;top:50%;transform:translateY(-50%);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;width:min(calc(100vw - 350px),calc((100vh - 60px)*1.333 + 16px))}
#cards button{position:relative;background:#fff;border:4px solid var(--navy);border-radius:18px;padding:0;overflow:hidden;box-shadow:0 6px 0 var(--navy);display:block}
#cards img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
#cards span{position:absolute;left:12px;top:10px;background:var(--navy);color:#fff;font-size:26px;font-weight:700;padding:5px 18px;border-radius:12px}
.opts button.sel{background:#fff4c9;border-color:#e0a020;box-shadow:0 5px 0 #b98500}
.nav{display:flex;justify-content:center;gap:14px;margin-top:14px}
.nav button{font-size:22px;font-weight:700;padding:10px 30px;border-radius:30px;background:#fff;border:3px solid var(--navy)}
#next,#again{background:var(--gold)!important}
body.touch .k{display:none}
body.touch #gifb{right:216px}
button{touch-action:manipulation}
#panel{touch-action:manipulation}
#toast-no{font-size:30px!important;color:#c9382c;margin:6px 0 0!important}
#drive{font-size:15px!important;margin:4px 0!important}
#qr img{width:210px;margin:6px auto 0;image-rendering:pixelated}
#qr p{font-size:16px!important}
#toast{max-height:calc(100vh - 110px);overflow:auto}
#toast>img{max-height:130px;object-fit:contain}
